<section class="login-page">
  <span class="login-page__blob login-page__blob--1" aria-hidden="true"></span>
  <span class="login-page__blob login-page__blob--2" aria-hidden="true"></span>
  <span class="login-page__blob login-page__blob--3" aria-hidden="true"></span>

  <app-login-form
    [form]="form"
    [isSubmitting]="isSubmitting()"
    [requestError]="requestError()"
    (submitted)="submit()"
  ></app-login-form>
</section>
